version: '3.8'

services:
  # Production build
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:8080'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network

  # Development mode
  dev:
    image: node:24.20.0-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    command: sh -c "corepack enable && corepack install && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
